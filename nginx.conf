server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejorar rendimiento de transferencia
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # SPA: todas las rutas apuntan a index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso hacia el backend de Ventas
    # BACK_VENTAS_HOST se inyecta por variable de entorno en el contenedor
    # - En local con docker-compose: usar nombre del servicio (back-ventas)
    # - En EC2 separadas: usar IP privada de la EC2 backend
    location /api/v1/ventas {
        proxy_pass http://${BACK_VENTAS_HOST}:${BACK_VENTAS_PORT}/api/v1/ventas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso hacia el backend de Despachos
    location /api/v1/despachos {
        proxy_pass http://${BACK_DESPACHOS_HOST}:${BACK_DESPACHOS_PORT}/api/v1/despachos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para assets estáticos compilados por Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
